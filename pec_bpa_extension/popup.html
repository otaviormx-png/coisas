<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PEC para BPA-I</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="popup-body">
  <main class="popup-card">
    <h1>PEC para BPA-I</h1>
    <p>Na <strong>Lista de atendimentos</strong>, coleta os status encontrados e percorre automaticamente as Agendas e os cadastros completos para obter CPF, CNS e endereço.</p>
    <button id="collect" class="primary">Coletar atendimentos da lista</button>
    <button id="review" class="secondary">Abrir lista de revisão</button>
    <p id="message" class="message" role="status"></p>
    <small>Nenhum atendimento é alterado no PEC.</small>
  </main>
  <script src="popup.js"></script>
</body>
</html>
